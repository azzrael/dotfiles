# shell
shell /usr/bin/fish

# font
font_family JetBrains Mono
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

# background
background_opacity 0.8
dynamic_background_opacity 1
background_blur 0

# animated cursor
cursor_trail 1

# audio bell
enable_audio_bell no

# window padding
window_padding_width 4

# confirmation to close window when process is running
confirm os_window_close 0


